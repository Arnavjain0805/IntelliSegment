{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">Edit Customer: {{ customer.name }}</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('edit_customer', id=customer.id) }}">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Name <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control" value="{{ customer.name }}" minlength="2" maxlength="60" required>
                        <div class="form-text">Between 2 and 60 characters.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Email <span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control" value="{{ customer.email }}" maxlength="100" required>
                        <div class="form-text">Must be a valid, unique email address.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Phone</label>
                        <input type="tel" name="phone" class="form-control" value="{{ customer.phone or '' }}" maxlength="25">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Country</label>
                        <input type="text" name="country" class="form-control" value="{{ customer.country or '' }}" maxlength="50">
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('customers') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success fw-bold">Update Customer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
