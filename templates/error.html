{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 text-center">
        <div class="card shadow-sm border-0 py-5 px-4 bg-white">
            <div class="card-body">
                <div class="display-1 fw-bold text-{{ color_class|default('warning') }} mb-3">
                    {{ error_code|default('Error') }}
                </div>
                <h3 class="fw-bold text-dark mb-3">{{ error_title|default('Something Went Wrong') }}</h3>
                <p class="text-muted fs-6 mb-4">
                    {{ error_message|default('An unexpected error occurred while processing your request.') }}
                </p>

                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('index') }}" class="btn btn-primary px-4 fw-bold">
                        &larr; Back to Dashboard
                    </a>
                    <a href="{{ url_for('customers') }}" class="btn btn-outline-secondary px-4">
                        Customer Directory
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
