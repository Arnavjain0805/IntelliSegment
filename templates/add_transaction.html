{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Add Transaction for {{ customer.name }}</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('add_transaction', id=customer.id) }}">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Transaction Date <span class="text-danger">*</span></label>
                        <input type="date" name="transaction_date" class="form-control" value="{{ transaction_date|default(today) }}" max="{{ today }}" required>
                        <div class="form-text">Cannot be set to a future date.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Amount ($) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" min="0.01" max="1000000" name="amount" class="form-control" value="{{ amount|default('') }}" placeholder="e.g. 150.00" required>
                        <div class="form-text">Positive amount up to $1,000,000.00.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Category</label>
                        <select name="category" class="form-select">
                            <option value="Electronics" {% if category == 'Electronics' %}selected{% endif %}>Electronics</option>
                            <option value="Clothing" {% if category == 'Clothing' %}selected{% endif %}>Clothing</option>
                            <option value="Groceries" {% if category == 'Groceries' %}selected{% endif %}>Groceries</option>
                            <option value="Services" {% if category == 'Services' %}selected{% endif %}>Services</option>
                            <option value="Other" {% if category == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('customer_details', id=customer.id) }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success fw-bold">Save Transaction</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
